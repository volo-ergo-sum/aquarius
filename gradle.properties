android.useAndroidX=true
android.nonTransitiveRClass=true

# Deliberately modest. GeckoView adds ~200 MB of native libraries to package and
# the merge/strip steps are memory hungry, so a machine with little headroom
# will have the Gradle daemon killed by the OOM reaper part way through - which
# surfaces as a bare "exit 137" rather than as anything that mentions memory.
# Raise these if your machine has room; they are a floor that works, not a
# recommendation.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
